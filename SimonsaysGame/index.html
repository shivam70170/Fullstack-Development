<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Say Game</h1>
    <h2>Press any key to start the game.</h2>


    <div class="box-continer">
        <div class="div1">
            <div class="box red" id="red"></div>
            <div class="box yellow" id="yellow"></div>
        </div>

        <div class="div2">
            <div class="box purple" id="purple"></div>
            <div class="box blue" id="blue"></div>
        </div>
    </div>
    <script src="simonsay.js"></script>
</body>
</html>
