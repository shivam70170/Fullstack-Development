      <body>
        <h1>Direct for search</h1>
        <form action="https://www.google.co.in/search">
            <h2>Google</h2>
            <input type="text" placeholder="search in google " name="q">
            <button>search</button>
        </form>
         <hr>
        <form action="https://www.youtube.com/results">
           <h2>Youtube</h2>
           <input type="text" placeholder="search in google" name="search_query">
           <button>search</button>
        </form>
         <hr>
          <form action="https://chat.openai.com/">
            <h2>chatgpt</h2>
            <input type="text" placeholder="search in chatgpt">
            <button>search</button>
           </form>
           <form action=""> 
            <input type="checkbox" id="age" name="age">
            <label for="age">i am 18+</label>
            <div>
                <h2>Gender</h2>
                 <input type="radio" name="gender" id="male" value="male">
                 <label for="male">Male</label>
                 <input type="radio" name="gender" id="female" value="female">
                 <label for="female">Female</label>
            </div>
            <div>
                <h2>choose those which you learn</h2>
                <input type="checkbox" name="lan" id="c++" value="c++">
                <label for="c++">c++</label>
                <input type="checkbox" name="lan" id="python" value="python">
                <label for="python">python</label>
                <input type="checkbox" name="lan" id="java" value="java">
                <label for="java">java</label>
            </div>
            <div>
                <select name="carrer" id="carrer option">
                    <option value="">select carrer option</option>
                    <option value="web">web developer</option>
                    <option value="sotware">software</option>
                    <option value="data ana">data analysist</option>
                    <option value="app">app development</option>
                </select>
            </div>
            <div>
                <input type="range" id="vol" name="vol" min="0" max="100">
                <label for="vol">select volume level</label>
                <br>
                <label for="text">What's the problem write here</label>
                <textarea name="text" id="text" placeholder="write here"></textarea>
            </div>
               <button>submit</button>
           </form>
        
</body>
